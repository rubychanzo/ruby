<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c3e50">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233498db'/%3E%3Cpath d='M50 80 C20 60 16 42 26 32 C35 23 46 27 50 36 C54 27 65 23 74 32 C84 42 80 60 50 80Z' fill='white'/%3E%3C/svg%3E">
<title>마음건강 자가검진</title>
<style>
  :root {
    --bg: #f4f7f6; --card: #ffffff; --line: #e1e4e8; --text: #2c3e50; --muted: #6b7785;
    --blue: #3498db; --blue-d: #2471a3; --orange: #f39c12; --red: #e74c3c;
    --good: #27ae60; --warn: #e67e22; --high: #d35400;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif; font-size: 15px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app-head { background: #2c3e50; color: #fff; padding: 0 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .app-head h1 { font-size: 18px; margin: 14px 0; font-weight: 700; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { background: transparent; border: 0; color: #c9d3dc; padding: 16px 14px; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; }
  .tabs button.on { color: #fff; border-bottom-color: var(--blue); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 17px; }
  .card h4 { margin: 18px 0 8px; font-size: 15px; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row > label { flex: 1 1 160px; }
  label.f { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  label.f input, label.f select, label.f textarea { display: block; width: 100%; margin-top: 4px; }
  input[type=text], input[type=number], input[type=tel], select, textarea { border: 1px solid #ccd3da; border-radius: 6px; padding: 7px 9px; background: #fff; }
  textarea { width: 100%; min-height: 54px; resize: vertical; line-height: 1.45; }
  input.sm { width: 64px; } input.md { width: 120px; }
  .btn { border: 1px solid #ccd3da; background: #fff; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: #f2f5f7; }
  .btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.pri:hover { background: var(--blue-d); }
  .btn.danger { color: #c0392b; }
  .btn.sm { padding: 4px 9px; font-size: 13px; }
  .btn.lg { padding: 12px 26px; font-size: 17px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .spacer { flex: 1; }
  .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
  table.t th { background: #f6f8fa; font-size: 13px; color: var(--muted); }
  .tbl-wrap { overflow-x: auto; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; color: #fff; font-size: 12.5px; font-weight: 700; }
  .b-양호 { background: var(--blue); } .b-주의 { background: var(--orange); } .b-위험 { background: var(--red); }
  .t-양호 { background: var(--good); } .t-주의 { background: var(--warn); } .t-위험 { background: var(--high); }
  .msg { padding: 10px 14px; border-radius: 8px; margin: 10px 0; font-size: 14px; line-height: 1.5; }
  .msg.err { background: #fdecea; color: #a93226; } .msg.ok { background: #e8f6ee; color: #1e8449; } .msg.info { background: #eef6fb; color: #1f618d; }

  /* 검사 화면 */
  .q-scale { margin-bottom: 22px; }
  .q-scale h3 { border-left: 5px solid var(--blue); padding-left: 10px; }
  .q-item { padding: 14px 0; border-top: 1px solid var(--line); }
  .q-item.missing { background: #fff4f2; }
  .q-item.skipped { opacity: .35; }
  .q-text { font-weight: 600; margin-bottom: 10px; line-height: 1.5; }
  .q-opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .q-opts label { flex: 1 1 140px; border: 1px solid #ccd3da; border-radius: 8px; padding: 11px 10px; text-align: center; cursor: pointer; background: #fff; user-select: none; }
  .q-opts input { display: none; }
  .q-opts label.sel { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .scale-pick label { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }

  /* 설정 */
  .set-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .set-nav button { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; }
  .set-nav button.on { background: var(--text); color: #fff; border-color: var(--text); }
  .save-bar { position: sticky; top: 0; z-index: 5; background: #fff8e6; border: 1px solid #f5d78e; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
  .ed-grid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .ed-grid { grid-template-columns: 1fr; } }
  .scale-list button { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .scale-list button.on { border-color: var(--blue); box-shadow: inset 4px 0 0 var(--blue); font-weight: 700; }
  .scale-list .off { color: var(--muted); font-size: 12px; }
  .item-ed, .rule-ed { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fbfcfd; }
  .item-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-weight: 700; }
  .opt-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .opt-row input[type=text] { flex: 1 1 200px; }
  .cond-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .drop { border: 2px dashed #b7c3cd; border-radius: 10px; padding: 34px; text-align: center; background: #fff; }
  .drop.over { border-color: var(--blue); background: #eef6fb; }

  /* 결과 보기 오버레이 */
  #overlay { position: fixed; inset: 0; background: rgba(30,40,50,.55); z-index: 50; overflow-y: auto; padding: 20px 10px; display: none; }
  #overlay.on { display: block; }
  .ov-bar { max-width: 650px; margin: 0 auto 10px; display: flex; gap: 8px; justify-content: flex-end; }

  /* 결과지 (기존 ReportTemplate 디자인) */
  .report { max-width: 650px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; color: #333; }
  .report h2 { text-align: center; color: #2c3e50; margin: 0 0 6px; font-size: 22px; }
  .report .r-date { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
  .report .user-info { background: #eef2f3; padding: 15px; border-radius: 8px; margin-bottom: 25px; display: flex; justify-content: space-around; font-size: 15px; flex-wrap: wrap; gap: 6px; }
  .report .result-card { background: #fafbfc; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; margin-bottom: 20px; break-inside: avoid; }
  .report .result-title { font-weight: bold; font-size: 16px; color: #2c3e50; margin-bottom: 8px; border-left: 4px solid #3498db; padding-left: 8px; }
  .report .desc-text { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 12px; }
  .report .score-box { font-size: 15px; font-weight: bold; text-align: center; background: #f1f2f6; padding: 8px; border-radius: 6px; margin-bottom: 12px; }
  .report .level-bar { display: flex; border-radius: 6px; overflow: hidden; font-weight: bold; font-size: 14px; text-align: center; color: #fff; }
  .report .level-item { flex: 1; padding: 8px 0; background: #bdc3c7; opacity: .4; }
  .report .level-item.active-양호 { background: #3498db; opacity: 1; }
  .report .level-item.active-주의 { background: #f39c12; opacity: 1; }
  .report .level-item.active-위험 { background: #e74c3c; opacity: 1; }
  .report .comment-box { display: flex; align-items: flex-start; background: #f8f9fa; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 13px; line-height: 1.4; color: #444; border: 1px solid #eee; }
  .report .comment-box span { font-size: 20px; margin-right: 8px; }
  .report .incomplete { font-size: 12px; color: #a93226; margin-top: 6px; text-align: right; }
  .report .total-card { border-radius: 8px; padding: 20px; margin-top: 25px; color: #fff; break-inside: avoid; }
  .report .total-card h3 { margin: 0 0 8px; border-bottom: 1px solid rgba(255,255,255,.3); padding-bottom: 8px; }
  .report .total-양호 { background: #27ae60; } .report .total-주의 { background: #e67e22; } .report .total-위험 { background: #d35400; }
  .report .contact-card { background: #eef6fb; border: 1px solid #d3e6f0; border-radius: 8px; padding: 16px 20px; margin-top: 20px; font-size: 17px; font-weight: bold; color: #2c3e50; line-height: 1.6; break-inside: avoid; }
  .report .contact-title { font-size: 18px; margin-bottom: 8px; }
  .report .contact-line { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .report .footer { text-align: center; margin-top: 30px; font-size: 13px; color: #7f8c8d; }

  #print-area { display: none; }
  body.public .app-head { justify-content: center; }
  body.public .tabs { display: none; }
  .consent { background:#f6f8fa; border-radius:8px; padding:12px 14px; font-size:13.5px; line-height:1.6; color:#4a5866; white-space:pre-line; margin:8px 0 10px; }
  .crisis { max-width:650px; margin:0 auto 12px; background:#fff1f0; border:2px solid #e74c3c; color:#922b21; border-radius:12px; padding:14px 18px; font-size:16px; line-height:1.6; }
  .crisis a { color:#c0392b; font-weight:800; font-size:20px; }
  .ov-bar { flex-wrap: wrap; }
  .ov-status { flex:1 1 100%; order:2; color:#fff; font-size:14px; text-align:right; }
  .ov-status:empty { display:none; }
  @media print {
    body { background: #fff !important; }
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; }
    .report-page { page-break-after: always; break-after: page; }
    .report-page:last-child { page-break-after: auto; break-after: auto; }
    .report { padding: 0 !important; max-width: none; }
    .report * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
<script>window.PUBLIC_MODE = true;</script>

<body>

<header class="app-head">
  <h1>📋 정신건강 자가검진</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="test" class="on">검사하기</button>
    <button data-tab="batch">엑셀 일괄처리</button>
    <button data-tab="records">검사 기록</button>
    <button data-tab="settings">척도·설정 관리</button>
  </nav>
</header>

<main>
  <section id="tab-test"></section>
  <section id="tab-batch" hidden></section>
  <section id="tab-records" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<div id="overlay">
  <div class="ov-bar"><span class="ov-status" id="ov-status"></span>
    <button class="btn pri" id="ov-print">🖨 인쇄 / PDF 저장</button>
    <button class="btn" id="ov-close">닫기</button>
  </div>
  <div id="ov-body"></div>
</div>

<div id="print-area"></div>

<script>
'use strict';
/* =====================================================================
   기본 설정 (처음 실행하거나 '기본값으로 초기화' 할 때 사용)
   ===================================================================== */
const OPT_PHQ = [
  { label: '전혀 방해받지 않았다', score: 0 },
  { label: '며칠 동안 방해 받았다', score: 1 },
  { label: '7일 이상 방해 받았다', score: 2 },
  { label: '거의 매일 방해 받았다', score: 3 }
];
const OPT_GAD = [
  { label: '전혀 방해받지 않았다', score: 0 },
  { label: '며칠 동안 방해 받았다', score: 1 },
  { label: '절반 이상 방해 받았다', score: 2 },
  { label: '거의 매일 방해 받았다', score: 3 }
];
const mkItems = (texts, opts, cols) => texts.map((t, i) => ({ text: t, col: cols ? cols[i] || '' : '', options: JSON.parse(JSON.stringify(opts)) }));

const DESC_PHQ_BAD = '높은 수준의 우울감은 흔히 신체적, 심리적 대처자원을 저하시키며, 개인의 일상생활을 어렵게 만들기도 합니다. 가까운 지역센터나 전문 기관을 방문하여 보다 상세한 평가와 도움을 받아보시기 바랍니다.';
const DESC_GAD_BAD = '주의가 필요한 수준의 걱정과 불안이 우려됩니다. 주의 깊은 관찰과 관심이 필요하며, 추가적인 평가 및 정신건강의학과 또는 정신건강복지센터에서의 전문가 상담이 필요할 수 있습니다.';

const DEFAULT_CONFIG = {
  version: 1,
  orgName: '',
  api: '',   // 참여자 화면 결과를 받을 구글시트 웹 앱 주소
  consentText: '수집 항목: 이름(별칭 가능), 연락처, 성별, 연령대, 거주지, 검사 응답 및 결과\n수집 목적: 검사 결과 안내 및 상담이 필요한 경우 센터의 연락·상담 연계\n보유 기간: 수집일로부터 1년\n동의를 거부할 수 있으며, 거부하실 경우 검사 참여가 제한됩니다.',
  hotline: '109 / 1577-0199',
  footer: '본 검사 결과는 자가검진 참고용으로 활용되며, 정확한 진단은 전문가와 상담하세요.',
  genders: ['남', '여'],
  ages: ['10대', '20대', '30대', '40대', '50대', '60대', '70대 이상'],
  infoColumns: { name: 'C', gender: 'D', age: 'E', region: 'F' },
  scales: [
    {
      id: 'phq9', enabled: true, name: '우울척도 (PHQ-9)', shortName: '우울척도', method: 'sum',
      intro: '우울증은 우울하고 슬픈 감정을 비롯하여 죄책감, 좌절감, 절망감, 고독감, 허무감 등과 같은 고통스러운 정서 상태가 지속되며, 이와 더불어 일상 활동에 대한 흥미와 즐거움이 저하되어 매사에 의욕이 없고 무력감을 자주 느끼는 것을 말합니다.',
      instruction: '지난 2주 동안 다음과 같은 문제들로 얼마나 자주 방해를 받았는지 선택해 주세요.',
      items: mkItems([
        '일을 하는 것에 대한 흥미나 재미가 거의 없음',
        '가라앉은 느낌, 우울감 혹은 절망감',
        '잠들기 어렵거나 자꾸 깨어남, 혹은 너무 많이 잠',
        '피곤함, 기력이 저하됨',
        '식욕 저하 혹은 과식',
        '내 자신이 실패자로 여겨지거나, 자신과 가족을 실망시켰다고 느낌',
        '신문을 읽거나 TV를 보는 것과 같은 일상적인 일에 집중하기 어려움',
        '다른 사람들이 눈치 챌 정도로 말과 행동이 느려짐, 혹은 너무 안절부절 못해서 가만히 앉아 있을 수 없음',
        '차라리 죽는 것이 낫겠다고 생각하거나, 어떻게든 자해를 하려고 생각함'
      ], OPT_PHQ, ['L', 'M', 'N', 'O', 'P', 'Q', 'R', 'S', 'T']),
      levels: [
        { min: 0, level: '양호', desc: '우울 감정 없이 긍정적이고 안정적인 일상을 보내고 계신 상태입니다.' },
        { min: 5, level: '주의', desc: DESC_PHQ_BAD },
        { min: 10, level: '위험', desc: DESC_PHQ_BAD }
      ],
      rules: [], default: { label: '', level: '양호', desc: '' }
    },
    {
      id: 'p4', enabled: true, name: '자살위험도 (P-4)', shortName: '자살위험도', method: 'rules',
      intro: '사람들은 삶에 희망이 보이지 않거나 더 이상 버텨낼 수 없다는 생각이 들 때, 또는 상대와의 관계를 풀어갈 수 없다는 생각이 들 때 가끔 자신을 지탱하고 있는 줄을 놓아버리고 싶은 생각이 듭니다. 자살시도의 과거력이 있거나 자살의도를 표현하는 경우 긴급 조치가 필요합니다.',
      instruction: '다음 질문에 답해 주세요.',
      items: [
        { text: '최근 한 달 동안 죽고 싶다는 생각을 해 본 적이 있습니까?', col: 'U',
          options: [{ label: '있다', score: 0 }, { label: '없다', score: 0, skip: true }] },
        { text: '과거에 자살을 시도한 적이 있습니까?', col: 'V',
          options: [{ label: '있다', score: 0 }, { label: '없다', score: 0 }] },
        { text: '최근에 자살 방법에 대해 생각해 본 적이 있습니까?', col: 'W',
          options: [{ label: '있다', score: 0 }, { label: '없다', score: 0 }] },
        { text: '실제로 자살을 시도할 가능성이 어느 정도라고 생각합니까?', col: 'Y',
          options: [{ label: '전혀 아니다', score: 0 }, { label: '약간 그렇다', score: 0 }, { label: '매우 그렇다', score: 0 }] },
        { text: '자살 시도를 하지 않도록 막아줄 수 있는 것(사람, 이유 등)이 있습니까?', col: 'Z',
          options: [{ label: '있다', score: 0 }, { label: '없다', score: 0 }] }
      ],
      levels: [],
      rules: [
        { match: 'any', conds: [{ item: 0, answers: [1] }], label: '자살위험성 거의 없음', level: '양호',
          desc: '자살 위험성이 거의 없으며 심리적으로 안정된 상태입니다.' },
        { match: 'any', conds: [{ item: 3, answers: [1, 2] }, { item: 4, answers: [1] }], label: '고위험', level: '위험',

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s == null ? '' : s).replace(/\s+/g, '');
function lsSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsLoad(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function today() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fileStamp() { return today().replace(/[-: ]/g, '').slice(0, 12); }

function colToIdx(c) { c = String(c || '').trim().toUpperCase(); if (!/^[A-Z]+$/.test(c)) return -1; let n = 0; for (const ch of c) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
function idxToCol(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function parseCols(str) {
  const out = [];
  String(str || '').toUpperCase().split(/[,\s]+/).filter(Boolean).forEach(p => {
    const m = p.match(/^([A-Z]+)[-~:]([A-Z]+)$/);
    if (m) { const a = colToIdx(m[1]), b = colToIdx(m[2]); const st = a <= b ? 1 : -1; for (let i = a; st > 0 ? i <= b : i >= b; i += st) out.push(idxToCol(i)); }
    else out.push(p);
  });
  return out;
}
function colsToStr(cols) {
  const res = []; let i = 0;
  while (i < cols.length) {
    let j = i; const a = colToIdx(cols[i]);
    if (a < 0) { res.push(cols[i] || '?'); i++; continue; }
    while (j + 1 < cols.length && colToIdx(cols[j + 1]) === colToIdx(cols[j]) + 1) j++;
    res.push(j - i >= 2 ? `${cols[i]}-${cols[j]}` : cols.slice(i, j + 1).join(','));
    i = j + 1;
  }
  return res.join(',');
}
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =====================================================================
   판정 엔진
   ===================================================================== */
// 응답 문자열 → 보기 번호 (띄어쓰기 무시, 포함 여부, 숫자 점수 순으로 매칭)
function matchOption(item, raw) {
  const a = norm(raw); if (!a) return -1;
  let idx = item.options.findIndex(o => norm(o.label) === a); if (idx >= 0) return idx;
  let best = -1, bl = 0;
  item.options.forEach((o, i) => { const l = norm(o.label); if (l && a.indexOf(l) !== -1 && l.length > bl) { best = i; bl = l.length; } });
  if (best >= 0) return best;
  if (/^-?\d+(\.\d+)?$/.test(a)) {
    const n = Number(a); const m = []; item.options.forEach((o, i) => { if (Number(o.score) === n) m.push(i); });
    if (m.length === 1) return m[0];
  }
  return -1;
}
function maxScore(scale) { return scale.items.reduce((s, it) => s + Math.max(0, ...it.options.map(o => Number(o.score) || 0)), 0); }

// 건너뛰기 반영: 건너뛰기 보기를 고른 문항 다음부터는 -2(해당 없음)
function effectiveAnswers(scale, ans) {
  const eff = []; let stop = false;
  scale.items.forEach((it, i) => {
    if (stop) { eff.push(-2); return; }
    const k = ans[i] == null ? -1 : ans[i]; eff.push(k);
    if (k >= 0 && it.options[k] && it.options[k].skip) stop = true;
  });
  return eff;
}
function evalScale(scale, ans) {
  const eff = effectiveAnswers(scale, ans);
  let score = 0, answered = 0, missing = 0;
  eff.forEach((k, i) => {
    if (k >= 0) { answered++; score += Number(scale.items[i].options[k].score) || 0; }
    else if (k === -1) missing++;
  });
  if (answered === 0) return null;
  if (scale.method === 'sum') {
    const lv = [...scale.levels].sort((x, y) => Number(x.min) - Number(y.min)).filter(l => score >= Number(l.min)).pop()
      || { level: '양호', desc: '' };
    return { score, label: String(score), level: lv.level, desc: lv.desc, missing };
  }
  for (const r of scale.rules) {
    const tests = (r.conds || []).map(c => eff[c.item] >= 0 && (c.answers || []).includes(eff[c.item]));
    const ok = r.match === 'all' ? (tests.length > 0 && tests.every(Boolean)) : tests.some(Boolean);
    if (ok) return { score, label: r.label, level: r.level, desc: r.desc, missing };
  }
  const d = scale.default || { label: '', level: '양호', desc: '' };
  return { score, label: d.label, level: d.level, desc: d.desc, missing };
}
function evalTotal(cfg, resById) {
  const vals = Object.values(resById).filter(Boolean);
  if (!vals.length) return null;
  for (const r of cfg.totalRules) {
    const tests = (r.conds || []).map(c => {
      if (c.scale === '*') return vals.some(x => (c.levels || []).includes(x.level));
      const x = resById[c.scale]; return !!x && (c.levels || []).includes(x.level);
    });
    const ok = r.match === 'all' ? (tests.length > 0 && tests.every(Boolean)) : tests.some(Boolean);
    if (ok) return { label: r.label, level: r.level, desc: r.desc };
  }
  return clone(cfg.totalDefault);
}
function regionKey(s) {
  let k = norm(s).replace(/^(인천광역시|인천시|인천)/, '');
  if (k.length > 1 && /[구군]$/.test(k)) k = k.slice(0, -1);
  return k;
}
function findRegion(cfg, region) {
  const k = regionKey(region); if (!k) return null;
  return cfg.regions.find(r => regionKey(r.name) === k || regionKey(r.display) === k) || null;
}
// 한 사람의 결과지 데이터(스냅샷) 만들기
function buildSnapshot(cfg, person, answersById, dateStr) {
  const scales = [], resById = {};
  cfg.scales.forEach(s => {
    if (!(s.id in answersById)) return;
    const r = evalScale(s, answersById[s.id]);
    resById[s.id] = r;
    if (!r) return;
    const eff = effectiveAnswers(s, answersById[s.id]);
    scales.push({ id: s.id, name: s.name, shortName: s.shortName, intro: s.intro, method: s.method,
      score: r.score, label: r.label, level: r.level, desc: r.desc, missing: r.missing,
      answers: eff.map((k, i) => k >= 0 ? s.items[i].options[k].label : (k === -2 ? '(해당없음)' : '')) });
  });
  const total = evalTotal(cfg, resById);
  const reg = findRegion(cfg, person.region);
  return { date: dateStr || today(), person: clone(person), scales, total,
    contact: reg ? { display: reg.display, phone: reg.phone, message: !!reg.message } : null,
    hotline: cfg.hotline, orgName: cfg.orgName, footer: cfg.footer };
}

function updateSkip(scale) {
  const eff = effectiveAnswers(scale, test.answers[scale.id]);
  const sEl = document.querySelector(`.q-scale[data-scale="${CSS.escape(scale.id)}"]`); if (!sEl) return;
  sEl.querySelectorAll('.q-item').forEach((iEl, i) => iEl.classList.toggle('skipped', eff[i] === -2));
}
function submitTest() {
  let first = null, cnt = 0;
  config.scales.filter(s => s.id in test.answers).forEach(s => {
    effectiveAnswers(s, test.answers[s.id]).forEach((k, i) => {
      if (k === -1) { cnt++; const iEl = document.querySelector(`.q-scale[data-scale="${CSS.escape(s.id)}"] .q-item[data-i="${i}"]`); iEl.classList.add('missing'); if (!first) first = iEl; }
    });
  });
  if (cnt) { $('#t-msg').innerHTML = `<div class="msg err">응답하지 않은 문항이 ${cnt}개 있습니다. 표시된 문항에 답해 주세요.</div>`; first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const p = test.person;
  const person = { name: p.name.trim(), gender: p.gender, age: p.age, region: p.region === '__etc' ? p.regionEtc.trim() : p.region };
  if (PUBLIC) person.phone = String(p.phone).replace(/[^0-9]/g, '');
  const snap = buildSnapshot(config, person, test.answers);
  if (PUBLIC) {
    const payload = sheetPayload(snap);
    showReport(snap, () => { newTest(); renderTest(); window.scrollTo(0, 0); });
    sendResult(payload);
    return;
  }
  records.unshift({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), snap });
  saveRecords();
  showReport(snap, () => { newTest(); renderTest(); window.scrollTo(0, 0); });
}

let sendQ = PUBLIC ? (lsLoad('mhs_pub_sendq') || []) : [];
function sheetPayload(snap) {
  return { action: 'submit', cid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), source: '참여자', submittedAt: snap.date,
    person: snap.person, consent: true, total: snap.total,
    scales: snap.scales.map(s => ({ id: s.id, name: s.shortName || s.name, method: s.method, score: s.score, label: s.label, level: s.level, answers: s.answers })) };
}
async function postResult(payload) {
  const r = await fetch(config.api, { method: 'POST', body: JSON.stringify(payload) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || '전송 오류'); return j;
}
function ovStatus(html) { const el = $('#ov-status'); if (el) el.innerHTML = html; }
async function sendResult(payload) {
  ovStatus('센터로 전송 중…');
  try { await postResult(payload); ovStatus('✓ 결과가 센터에 전달되었습니다'); }
  catch (e) {
    sendQ.push(payload); lsSave('mhs_pub_sendq', sendQ);
    ovStatus('⚠ 인터넷 연결이 불안정해 센터에 아직 전달되지 않았습니다. <button class="btn sm" id="ov-retry">다시 보내기</button>');
    const b = $('#ov-retry'); if (b) b.onclick = async () => { ovStatus('다시 보내는 중…'); await flushSendQ(); ovStatus(sendQ.length ? '⚠ 아직 전달되지 않았습니다. 인터넷 연결을 확인한 뒤 이 화면을 다시 열어 주세요.' : '✓ 결과가 센터에 전달되었습니다'); };
  }
}
async function flushSendQ() {
  if (!sendQ.length || !config.api) return;
  const rest = [];
  for (const p of sendQ) { try { await postResult(p); } catch (e) { rest.push(p); } }
  sendQ = rest; lsSave('mhs_pub_sendq', sendQ);
}

function loadBatchFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true });
      batch = { fileName: file.name, wb, sheet: wb.SheetNames[0], rows: [], hasHeader: true, map: defaultMap(), results: null, filter: '', msg: '' };
      readSheet(); renderBatch();
    } catch (e) { alert('파일을 읽지 못했습니다: ' + e.message); }
  };
  fr.readAsArrayBuffer(file);
}
function readSheet() {
  const ws = batch.wb.Sheets[batch.sheet];
  batch.rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: false });
}
function runBatch() {
  const b = batch, m = b.map, errs = [];
  const used = config.scales.filter(s => m.use[s.id]).map(s => ({ s, cols: parseCols(m.scales[s.id]).map(colToIdx) }));
  used.forEach(u => { if (u.cols.length !== u.s.items.length || u.cols.some(c => c < 0)) errs.push(`${u.s.shortName || u.s.name}: 열 개수(${u.cols.length})가 문항 수(${u.s.items.length})와 다르거나 잘못된 열이 있습니다.`); });
  if (!used.length) errs.push('계산할 척도를 하나 이상 선택해 주세요.');
  if (errs.length) { b.msg = `<div class="msg err">${errs.map(esc).join('<br>')}</div>`; b.results = null; renderBatch(); return; }
  const ic = {}; for (const k of ['name', 'gender', 'age', 'region']) ic[k] = colToIdx(m.info[k]);
  const start = b.hasHeader ? 1 : 0, out = [], unmatched = {};
  for (let r = start; r < b.rows.length; r++) {
    const row = b.rows[r];
    const get = i => i >= 0 && row[i] != null ? String(row[i]).trim() : '';
    const person = { name: get(ic.name), gender: get(ic.gender), age: get(ic.age), region: get(ic.region) };
    const answers = {}; let any = false;
    used.forEach(u => {
      answers[u.s.id] = u.cols.map((c, i) => {
        let raw = get(c); if (raw === '(해당없음)') raw = ''; if (raw) any = true;
        const k = matchOption(u.s.items[i], raw);
        if (raw && k < 0) { const key = `${u.s.shortName || u.s.name} ${idxToCol(c)}열: "${raw}"`; unmatched[key] = (unmatched[key] || 0) + 1; }
        return k;
      });
    });
    if (!any && !person.name) continue;
    out.push({ row: r, snap: buildSnapshot(config, person, answers, today()), sel: true });
  }
  b.results = out; b.usedIds = used.map(u => u.s.id);
  const um = Object.entries(unmatched);
  b.msg = `<div class="msg ok">${out.length}명 계산 완료.</div>` + (um.length ? `<div class="msg err"><b>보기와 맞지 않아 점수에 넣지 못한 응답</b> (척도 관리에서 보기 문구를 확인하세요)<br>${um.slice(0, 15).map(([k, n]) => esc(k) + ` — ${n}건`).join('<br>')}${um.length > 15 ? `<br>외 ${um.length - 15}종` : ''}</div>` : '');
  renderBatch();
}

    </table></div>
  </div>`;
}
function bindBatchResults() {
  const b = batch;
  $('#b-filter').onchange = e => { b.filter = e.target.value; renderBatch(); };
  $('#b-all').onchange = e => { filteredResults().forEach(x => x.sel = e.target.checked); renderBatch(); };
  document.querySelectorAll('[data-sel]').forEach(c => c.onchange = () => { b.results[Number(c.dataset.sel)].sel = c.checked; });
  document.querySelectorAll('[data-view]').forEach(c => c.onclick = () => showReport(b.results[Number(c.dataset.view)].snap));
  $('#b-print-sel').onclick = () => printReports(filteredResults().filter(x => x.sel).map(x => x.snap));
  $('#b-print-all').onclick = () => printReports(filteredResults().map(x => x.snap));
  $('#b-xlsx').onclick = exportBatch;

function exportBatch() {
  const b = batch, sc = config.scales.filter(s => b.usedIds.includes(s.id));
  const extraHead = []; sc.forEach(s => { const n = s.shortName || s.name; if (s.method === 'sum') extraHead.push(n + ' 점수', n + ' 단계'); else extraHead.push(n + ' 결과', n + ' 단계'); });
  extraHead.push('총결과');
  const width = Math.max(...b.rows.map(r => r.length));
  const pad = r => { const a = r.slice(); while (a.length < width) a.push(''); return a; };
  const byRow = {}; b.results.forEach(x => byRow[x.row] = x.snap);
  const aoa = [];
  b.rows.forEach((r, i) => {
    if (b.hasHeader && i === 0) { aoa.push(pad(r).concat(extraHead)); return; }
    const sn = byRow[i]; const ext = [];
    sc.forEach(s => { const y = sn && sn.scales.find(z => z.id === s.id); if (!y) ext.push('', ''); else if (s.method === 'sum') ext.push(y.score, y.level); else ext.push(y.label, y.level); });
    ext.push(sn && sn.total ? sn.total.label : '');
    aoa.push(pad(r).concat(ext));
  });
  if (!b.hasHeader) aoa.unshift(new Array(width).fill('').concat(extraHead));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), '결과');
  saveWb(wb, b.fileName.replace(/\.(xlsx|xls|csv)$/i, '') + '_결과_' + fileStamp() + '.xlsx');
}

/* =====================================================================
   3) 검사 기록
   ===================================================================== */
let recSel = new Set(), recMsg = '';
// 다른 기기에서 '엑셀로 내려받기' 한 검사 기록 파일을 이 기기 기록에 합치기
function importRecords(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      const head = (rows[0] || []).map(h => String(h).trim());
      const hi = n => head.indexOf(n);
      if (hi('검사일시') < 0 || hi('이름') < 0) throw new Error('‘검사 기록 → 엑셀로 내려받기’로 만든 파일이 아닙니다. 구글폼 응답 파일은 ‘엑셀 일괄처리’를 이용하세요.');
      const notes = [], plan = [];
      config.scales.forEach(s => {
        const n = s.shortName || s.name;
        const cols = s.items.map((_, i) => hi(`${n} ${i + 1}`));
        const found = cols.filter(c => c >= 0).length;
        if (!found) return;
        if (found !== s.items.length || hi(`${n} ${s.items.length + 1}`) >= 0) { notes.push(`${n}: 파일의 문항 수가 현재 설정(${s.items.length}문항)과 달라 제외했습니다.`); return; }
        plan.push({ s, cols });
      });
      const known = new Set(plan.map(x => x.s.shortName || x.s.name));
      const other = new Set(head.map(h => (h.match(/^(.+) \d+$/) || [])[1]).filter(Boolean).filter(n => !known.has(n) && !notes.some(t => t.startsWith(n + ':'))));
      other.forEach(n => notes.push(`${n}: 이 기기 설정에 없는 척도라 제외했습니다.`));
      if (!plan.length) throw new Error('이 기기 설정과 맞는 척도가 파일에 없습니다.');
      const keyOf = sn => [sn.date, sn.person.name, sn.person.gender, sn.person.age, sn.person.region].join('|');
      const have = new Set(records.map(r => keyOf(r.snap)));
      let added = 0, dup = 0, unmatched = 0;
      rows.slice(1).forEach((row, ri) => {
        const get = i => i >= 0 && row[i] != null ? String(row[i]).trim() : '';
        const person = { name: get(hi('이름')), gender: get(hi('성별')), age: get(hi('연령대')), region: get(hi('거주지')) };
        const answers = {}; let any = false;
        plan.forEach(({ s, cols }) => {
          answers[s.id] = cols.map((c, i) => { let raw = get(c); if (raw === '(해당없음)') raw = '';
            if (raw) any = true; const k = matchOption(s.items[i], raw); if (raw && k < 0) unmatched++; return k; });
        });
        if (!any) return;
        const snap = buildSnapshot(config, person, answers, get(hi('검사일시')) || today());
        if (have.has(keyOf(snap))) { dup++; return; }
        have.add(keyOf(snap));
        records.push({ id: Date.now() + '_' + ri + '_' + Math.random().toString(36).slice(2, 6), snap, imported: file.name });
        added++;
      });
      records.sort((a, b) => String(b.snap.date).localeCompare(String(a.snap.date)));
      saveRecords();
      recMsg = `<div class="msg ok">${esc(file.name)}: ${added}건을 합쳤습니다.${dup ? ` (이미 있는 기록 ${dup}건은 건너뜀)` : ''} 결과는 이 기기의 현재 척도 설정으로 다시 계산했습니다.</div>`
        + (notes.length || unmatched ? `<div class="msg err">${notes.map(esc).join('<br>')}${unmatched ? `${notes.length ? '<br>' : ''}보기 문구와 맞지 않아 점수에 넣지 못한 응답 ${unmatched}개가 있습니다. 두 기기의 척도 설정이 같은지 확인하세요.` : ''}</div>` : '');
    } catch (err) { recMsg = `<div class="msg err">불러오지 못했습니다: ${esc(err.message)}</div>`; }
    renderRecords();
  };
  fr.readAsArrayBuffer(file);
}
function renderRecords() {
  const el = $('#tab-records');
  el.innerHTML = `
  <div class="card">
    <h3>검사 기록 (${records.length}건)</h3>
    <p class="hint">‘검사하기’로 실시한 결과가 이 기기에 저장됩니다. 민감한 정보이므로 공용 기기라면 정기적으로 엑셀로 내려받은 뒤 삭제해 주세요. 결과지는 검사 당시 기준으로 다시 출력됩니다.<br>
    패드 등 다른 기기에서 ‘엑셀로 내려받기’ 한 파일은 <b>다른 기기 기록 불러오기</b>로 이곳에 합칠 수 있습니다. 이미 있는 기록은 중복으로 들어가지 않습니다.</p>
    <div class="bar">
      <button class="btn pri" id="r-xlsx" ${records.length ? '' : 'disabled'}>엑셀로 내려받기</button>
      <button class="btn" id="r-print" ${records.length ? '' : 'disabled'}>선택 결과지 인쇄</button>
      <label class="btn">다른 기기 기록 불러오기<input type="file" id="r-import" accept=".xlsx,.xls,.csv" hidden></label>
      <span class="spacer"></span>
      <button class="btn danger" id="r-del" ${records.length ? '' : 'disabled'}>선택 삭제</button>
    </div>
    ${recMsg}
    ${records.length ? `<div class="tbl-wrap"><table class="t">
      <tr><th><input type="checkbox" id="r-all"></th><th>검사일시</th><th>이름</th><th>성별</th><th>연령대</th><th>거주지</th><th>검사 결과</th><th>총결과</th><th></th></tr>
      ${records.map(r => { const sn = r.snap; return `<tr>
        <td><input type="checkbox" data-rsel="${esc(r.id)}" ${recSel.has(r.id) ? 'checked' : ''}></td>

        <td>${sn.scales.map(s => `${esc(s.shortName || s.name)} ${s.method === 'sum' ? esc(s.score) + ' ' : ''}<span class="badge b-${esc(s.level)}">${esc(s.method === 'sum' ? s.level : s.label)}</span>`).join('<br>')}</td>
        <td>${sn.total ? `<span class="badge t-${esc(sn.total.level)}">${esc(sn.total.label)}</span>` : '-'}</td>
        <td><button class="btn sm" data-rview="${esc(r.id)}">보기</button></td></tr>`; }).join('')}
    </table></div>` : '<div class="msg info">아직 검사 기록이 없습니다.</div>'}
  </div>`;
  $('#r-import').onchange = e => { if (e.target.files[0]) importRecords(e.target.files[0]); };
  if (!records.length) return;
  $('#r-all').onchange = e => { recSel = e.target.checked ? new Set(records.map(r => r.id)) : new Set(); renderRecords(); };
  el.querySelectorAll('[data-rsel]').forEach(c => c.onchange = () => { c.checked ? recSel.add(c.dataset.rsel) : recSel.delete(c.dataset.rsel); });
  el.querySelectorAll('[data-rview]').forEach(c => c.onclick = () => showReport(records.find(r => r.id === c.dataset.rview).snap));
  $('#r-print').onclick = () => printReports(records.filter(r => recSel.has(r.id)).map(r => r.snap));
  $('#r-del').onclick = () => {
    if (!recSel.size) { alert('삭제할 기록을 선택해 주세요.'); return; }
    if (!confirm(`선택한 ${recSel.size}건을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    records = records.filter(r => !recSel.has(r.id)); recSel = new Set(); saveRecords(); renderRecords();
  };
  $('#r-xlsx').onclick = exportRecords;
}
function exportRecords() {
  const ids = [], meta = {};
  records.slice().reverse().forEach(r => r.snap.scales.forEach(s => { if (!meta[s.id]) { ids.push(s.id); meta[s.id] = { name: s.shortName || s.name, method: s.method, n: s.answers.length }; } else meta[s.id].n = Math.max(meta[s.id].n, s.answers.length); }));
  const head = ['검사일시', '이름', '성별', '연령대', '거주지'];
  ids.forEach(id => { const m = meta[id]; for (let i = 0; i < m.n; i++) head.push(`${m.name} ${i + 1}`); head.push(m.method === 'sum' ? m.name + ' 점수' : m.name + ' 결과', m.name + ' 단계'); });
  head.push('총결과');
  const aoa = [head];
  records.forEach(r => {
    const sn = r.snap, row = [sn.date, sn.person.name, sn.person.gender, sn.person.age, sn.person.region];
    ids.forEach(id => { const m = meta[id], s = sn.scales.find(x => x.id === id);
      for (let i = 0; i < m.n; i++) row.push(s ? (s.answers[i] || '') : '');
      row.push(s ? (s.method === 'sum' ? s.score : s.label) : '', s ? s.level : ''); });
    row.push(sn.total ? sn.total.label : '');
    aoa.push(row);
  });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), '검사기록');
  saveWb(wb, '자가검진_검사기록_' + fileStamp() + '.xlsx');
}

// 입력값 → draft
['input', 'change'].forEach(ev => $('#tab-settings').addEventListener(ev, e => {
  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  if (ev === 'input' && (t.tagName === 'SELECT' || t.type === 'checkbox')) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.type === 'num') v = v === '' ? 0 : Number(v);
  if (t.dataset.type === 'list') v = v.split(',').map(x => x.trim()).filter(Boolean);
  if (/\.col$|^infoColumns\./.test(t.dataset.bind)) v = String(v).trim().toUpperCase();
  setPath(draft, t.dataset.bind, v); markDirty();
  if (t.dataset.rerender) renderSettings();
}));
$('#tab-settings').addEventListener('change', e => {
  if (e.target.id !== 'cfg-file' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { const c = JSON.parse(fr.result); if (!c.scales || !c.totalRules) throw new Error('자가검진 설정 파일이 아닙니다.');
      draft = migrate(c); selScale = 0; markDirty(); renderSettings(); alert('불러왔습니다. 확인 후 ‘저장’을 눌러야 적용됩니다.');
    } catch (err) { alert('설정 파일을 읽지 못했습니다: ' + err.message); }
  };
  fr.readAsText(e.target.files[0], 'utf-8');
});
// 버튼 동작
$('#tab-settings').addEventListener('click', e => {
  const sub = e.target.closest('[data-sub]'); if (sub) { setSub = sub.dataset.sub; renderSettings(); return; }
  const ss = e.target.closest('[data-sel-scale]'); if (ss) { selScale = Number(ss.dataset.selScale); renderSettings(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset, s = draft.scales[selScale];
  const mv = (arr, i, dd) => { const j = i + dd; if (j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; };
  const I = k => Number(d[k]);
  switch (d.act) {
    case 'save': {
      const ids = draft.scales.map(x => x.id); if (new Set(ids).size !== ids.length) { alert('척도 ID가 겹칩니다.'); return; }
      config = clone(draft); if (!lsSave(LS_CFG, config)) alert('이 브라우저에 저장하지 못했습니다. 설정 파일로 내보내 두세요.');
      dirty = false; newTest(); renderSettings(); return;
    }
    case 'revert': if (!confirm('저장하지 않은 변경사항을 버릴까요?')) return; draft = clone(config); dirty = false; renderSettings(); return;
    case 'addScale':
      draft.scales.push({ id: 'scale_' + Date.now().toString(36), enabled: true, name: '새 척도', shortName: '새 척도', method: 'sum', intro: '', instruction: '',
        items: [{ text: '', col: '', options: clone(OPT_PHQ) }], levels: [{ min: 0, level: '양호', desc: '' }], rules: [], default: { label: '', level: '양호', desc: '' } });
      selScale = draft.scales.length - 1; break;
    case 'dupScale': { const c = clone(s); c.id = 'scale_' + Date.now().toString(36); c.name += ' (복사본)'; draft.scales.splice(selScale + 1, 0, c); selScale++; break; }
    case 'delScale': if (!confirm(`‘${s.name}’ 척도를 삭제할까요?`)) return; draft.scales.splice(selScale, 1); selScale = Math.max(0, selScale - 1); break;
    case 'mvScale': if (mv(draft.scales, selScale, I('d'))) selScale += I('d'); break;
    case 'addItem': s.items.push({ text: '', col: '', options: clone(s.items[s.items.length - 1] ? s.items[s.items.length - 1].options : OPT_PHQ) }); break;
    case 'delItem': if (!confirm(`${I('i') + 1}번 문항을 삭제할까요?`)) return; s.items.splice(I('i'), 1); fixRuleItems(s, I('i'), null); break;
    case 'mvItem': { const i = I('i'), j = i + I('d'); if (mv(s.items, i, I('d'))) fixRuleItems(s, i, j); break; }
    case 'addOpt': s.items[I('i')].options.push({ label: '', score: 0 }); break;
    case 'delOpt': { const it = s.items[I('i')], k = I('k'); it.options.splice(k, 1);
      s.rules.forEach(r => r.conds.forEach(c => { if (c.item === I('i')) c.answers = c.answers.filter(a => a !== k).map(a => a > k ? a - 1 : a); })); break; }
    case 'copyOpts': if (!s.items.length || !confirm('1번 문항의 보기와 점수를 나머지 모든 문항에 덮어쓸까요?')) return; s.items.forEach((it, i) => { if (i) it.options = clone(s.items[0].options); }); break;
    case 'fillCols': { const st = colToIdx($('#startcol').value); if (st < 0) { alert('시작 열을 L처럼 영문으로 입력하세요.'); return; } s.items.forEach((it, i) => it.col = idxToCol(st + i)); break; }
    case 'addLevel': s.levels.push({ min: maxScore(s), level: '위험', desc: '' }); break;
    case 'delLevel': s.levels.splice(I('j'), 1); break;
    case 'addRule': s.rules.push({ match: 'any', conds: [{ item: 0, answers: [] }], label: '', level: '주의', desc: '' }); break;
    case 'delRule': s.rules.splice(I('j'), 1); break;
    case 'mvRule': mv(s.rules, I('j'), I('d')); break;
    case 'addCond': s.rules[I('j')].conds.push({ item: 0, answers: [] }); break;
    case 'delCond': s.rules[I('j')].conds.splice(I('ci'), 1); break;
    case 'togAns': { const c = s.rules[I('j')].conds[I('ci')], k = I('k'); c.answers = b.checked ? [...new Set([...c.answers, k])] : c.answers.filter(a => a !== k); markDirty(); return; }
    case 'addTRule': draft.totalRules.push({ match: 'any', conds: [{ scale: '*', levels: ['위험'] }], label: '', level: '주의', desc: '' }); break;
    case 'delTRule': draft.totalRules.splice(I('j'), 1); break;
    case 'mvTRule': mv(draft.totalRules, I('j'), I('d')); break;
    case 'addTCond': draft.totalRules[I('j')].conds.push({ scale: '*', levels: [] }); break;
    case 'delTCond': draft.totalRules[I('j')].conds.splice(I('ci'), 1); break;
    case 'togLvl': { const c = draft.totalRules[I('j')].conds[I('ci')]; c.levels = b.checked ? [...new Set([...c.levels, d.l])] : c.levels.filter(x => x !== d.l); markDirty(); return; }
    case 'addRegion': draft.regions.push({ name: '', display: '', phone: '', message: false }); break;
    case 'delRegion': draft.regions.splice(I('j'), 1); break;
    case 'exportPublic': {
      const c = dirty ? draft : config;
      if (!c.api) { if (!confirm('구글시트 웹 앱 주소(기본 설정)가 비어 있습니다. 이대로 내보내면 참여자 화면에서 결과가 센터로 전송되지 않습니다. 계속할까요?')) return; }
      download('selfcheck-config.json', new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' })); return;
    }
    case 'publishCfg': {
      if (dirty) { alert('저장하지 않은 변경사항이 있습니다. 먼저 ‘저장’을 눌러 주세요.'); return; }
      if (!config.api) { alert('기본 설정에 ‘구글시트 웹 앱 주소’를 먼저 넣고 저장해 주세요.'); return; }
      const used = config.scales.filter(x => x.enabled).map(x => x.shortName || x.name).join(', ');
      const key = prompt(`참여자 화면에 반영할 척도: ${used || '(없음)'}\n\n직원 비밀번호를 입력하세요.`); if (key === null) return;
      const by = prompt('반영하는 사람 이름 (기록용)', '') || '';
      fetch(config.api, { method: 'POST', body: JSON.stringify({ action: 'publishConfig', key, by, config }) })
        .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); alert(`참여자 화면에 반영했습니다 (${r.updatedAt}).`); })
        .catch(err => alert('반영하지 못했습니다: ' + (navigator.onLine ? err.message : '인터넷 연결을 확인해 주세요.')));
      return;
    }
    case 'pullCfg': {
      const api = (dirty ? draft : config).api;
      if (!api) { alert('기본 설정에 ‘구글시트 웹 앱 주소’를 먼저 넣어 주세요.'); return; }
      fetch(api + '?action=config', { cache: 'no-store' }).then(r => r.json()).then(r => {
        if (!r.ok) throw new Error(r.error); if (!r.config) throw new Error('아직 반영된 설정이 없습니다.');
        draft = migrate(r.config); draft.api = api; selScale = 0; markDirty(); renderSettings();
        alert(`참여자 화면 설정(${r.updatedAt} 반영)을 받아왔습니다. 확인 후 ‘저장’을 눌러야 이 기기에 적용됩니다.`);
      }).catch(err => alert('받아오지 못했습니다: ' + (navigator.onLine ? err.message : '인터넷 연결을 확인해 주세요.')));
      return;
    }
    case 'loadOnline':
      fetch('selfcheck-config.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('파일이 없습니다'); return r.json(); })
        .then(c => { if (!c.scales) throw new Error('설정 파일이 아닙니다'); draft = migrate(c); selScale = 0; markDirty(); renderSettings(); alert('받아왔습니다. 확인 후 ‘저장’을 눌러야 이 기기에 적용됩니다.'); })
        .catch(err => alert('받아오지 못했습니다: ' + err.message));
      return;
    case 'exportCfg': download('자가검진_설정_' + fileStamp() + '.json', new Blob([JSON.stringify(dirty ? draft : config, null, 2)], { type: 'application/json' })); return;
    case 'resetCfg': if (!confirm('모든 척도와 설정을 기본값으로 되돌릴까요? (저장을 눌러야 적용)')) return; draft = clone(DEFAULT_CONFIG); selScale = 0; break;
    default: return;
  }
  markDirty(); renderSettings();
});
// 문항 이동/삭제 시 규칙의 문항 번호 보정
function fixRuleItems(s, from, to) {
  s.rules.forEach(r => {
    if (to === null) { r.conds = r.conds.filter(c => c.item !== from); r.conds.forEach(c => { if (c.item > from) c.item--; }); }
    else r.conds.forEach(c => { if (c.item === from) c.item = to; else if (c.item === to) c.item = from; });
  });
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

if (PUBLIC) {
  // 참여자 화면: 센터가 올린 설정을 받아 검사 화면만 보여줌 (이 폰에는 결과를 남기지 않음)
  document.body.classList.add('public');
  $('.app-head h1').textContent = '📋 마음건강 자가검진';
  $('#ov-close').textContent = '처음으로';
  $('#ov-print').textContent = '🖨 결과 저장(PDF)';
  $('#tab-test').innerHTML = '<div class="card">검사를 준비하는 중입니다…</div>';
  fetch('selfcheck-config.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(async c => {
      config = migrate(c);
      if (!config.api) throw new Error();
      try {   // 직원이 ‘참여자 화면에 바로 반영’한 최신 설정이 있으면 그것을 사용
        const r = await (await fetch(config.api + '?action=config', { cache: 'no-store' })).json();
        if (r.ok && r.config && r.config.scales) { const api = config.api; config = migrate(r.config); config.api = api; }
      } catch (e) {}
      if (config.orgName) $('.app-head h1').textContent = '📋 ' + config.orgName + ' 마음건강 자가검진';
      newTest(); renderTest(); flushSendQ();
    })
    .catch(() => { $('#tab-test').innerHTML = '<div class="card msg err">검사를 준비하지 못했습니다. 잠시 후 다시 열어 주세요. 계속 안 되면 센터로 문의해 주세요.</div>'; });
  window.addEventListener('online', () => flushSendQ());
} else {
  if (/^https?:$/.test(location.protocol)) {
    const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  renderTest();
}
</script>
</body>
